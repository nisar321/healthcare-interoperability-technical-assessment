services:
  hapi-postgres:
    image: postgres:16
    container_name: healthcare-hapi-postgres
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: localdev_only_change_me
    volumes:
      - hapi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  hapi:
    # Pin a tested release tag/digest before assessment submission.
    image: hapiproject/hapi:latest
    container_name: healthcare-hapi-fhir
    depends_on:
      hapi-postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hapi-postgres:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: localdev_only_change_me
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
    restart: unless-stopped

volumes:
  hapi-postgres-data:
